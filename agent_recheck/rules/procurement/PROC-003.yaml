# -*- coding: utf-8 -*-
# 采购需求规则 - 实质性条款标记

id: PROC-003
name: 实质性条款标记不一致
category: procurement
level: medium
description: |
  实质性条款（★或▲标记）的表述前后不一致，
  或标记含义不明确。
enabled: true

# 触发条件
trigger:
  type: composite
  match:
    - "★"
    - "实质性"
  conditions:
    - keyword: "★"

verification:
  check_type: contextual
  # 检查多个★标记是否存在不同表述
  check_patterns:
    - "不可负偏离"
    - "不可偏离"
    - "负偏离"
    - "投标无效"

reference:
  - name: "87号令"
    article: "第五十条"
    note: "招标文件应当明确规定是否允许偏离及允许偏离的范围和幅度"

suggestion:
  template: "统一实质性条款的标记和表述"
