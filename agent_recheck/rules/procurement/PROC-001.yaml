# -*- coding: utf-8 -*-
# 采购需求规则 - 技术参数指向性

id: PROC-001
name: 技术参数不得指向特定品牌或产品
category: procurement_requirement
level: high
description: |
  技术需求中的规格参数不得指向特定品牌、特定产品，
  不得通过参数设置排除其他潜在供应商。
enabled: true

# 触发条件
trigger:
  type: composite
  conditions:
    - type: keyword
      match:
        - "技术参数"
        - "规格"
        - "型号"
        - "配置"
      severity: medium
    
    - type: pattern
      match:
        - "品牌型号"
        - "等同于"
        - "参照"
        - "必须是"
      severity: critical

# 上下文验证
verification:
  check_type: contextual
  
  # 检查是否为具体品牌
  check_items:
    - type: brand_name
      severity: critical
    - type: specific_model
      severity: critical
    - type: proprietary_feature
      severity: high

# 关联法规
reference:
  - name: "政府采购法"
    article: "第三十六条"
  - name: "政府采购货物和服务招标投标管理办法"
    article: "第十一条"

# 建议模板
suggestion:
  template: "将技术参数修改为性能指标或功能要求，避免指向特定品牌"
  examples:
    - "修改为'具有XX功能的设备'"
    - "修改为'XX性能指标达到XX级别'"
