# -*- coding: utf-8 -*-
# 采购需求规则 - 允许偏差未填写

id: PROC-001
name: 允许偏差未填写
category: procurement
level: medium
description: |
  采购需求中"允许偏差"参数未填写具体值，
  投标人无法明确理解技术要求。
enabled: true

# 触发条件
trigger:
  type: regex
  match:
    - "允许偏差[\\u4e00-\\u9fff]*[±＋-][\\u4e00-\\u9fff]*[°″']?"
    - "允许偏差[：:]\\s*[×xX*]?[\\u4e00-\\u9fff]*$"
    - "[±＋-][0-9]+%[\\u4e00-\\u9fff]*$"
    - "允许偏差\\s*[（(][×xX*]?[）)]"

verification:
  check_type: negative
  # 检查是否为空或占位符
  invalid_patterns:
    - "允许偏差±"
    - "允许偏差×"
    - "允许偏差（）"

reference:
  - name: "政府采购法"
    article: "第二十条"
    note: "采购需求应当完整、明确"

suggestion:
  template: "填写允许偏差的具体数值"
