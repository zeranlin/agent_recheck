# -*- coding: utf-8 -*-
# 采购需求规则 - 软件产品差异化要求

id: PROC-002
name: 软件产品差异化要求
category: procurement
level: medium
description: |
  非软件开发类项目中，对软件产品设置差异化要求，
  如要求"自有软件"而排斥"租赁软件"，构成歧视性条款。
enabled: true

# 触发条件
trigger:
  type: composite
  match:
    - "自有"
    - "租赁"
  conditions:
    - keyword: "软件"
    - level_match: "(?:自有|租赁|国产|进口)"

verification:
  check_type: contextual
  # 检查是否存在一视同仁的表述
  check_patterns:
    - "不应区别对待"
    - "均视为"
    - "一视同仁"
  require_context:
    - "软件"

reference:
  - name: "政府采购法"
    article: "第三条"
    note: "政府采购应当遵循公开透明、公平竞争、公正和诚实信用原则"

suggestion:
  template: "软件产品自有或租赁不应区别对待，或明确表述一视同仁"
