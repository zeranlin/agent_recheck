# -*- coding: utf-8 -*-
# 采购需求规则 - 服务内容完整性

id: PROC-004
name: 服务需求内容不完整
category: procurement
level: medium
description: |
  服务类采购项目中，工作内容或人员配置要求不完整，
  如"提供相关服务"但未明确具体内容。
enabled: true

# 触发条件
trigger:
  type: composite
  match:
    - "服务"
    - "工作内容"
    - "人员"
  conditions:
    - keyword: "服务"
    - level_match: "(?:相关|涉及|负责).{0,10}(?:工作|内容|服务)"

verification:
  check_type: contextual
  # 检查是否有具体内容
  check_patterns:
    - "包括但不限于"
    - "具体包括"
    - "例如"

reference:
  - name: "政府采购需求管理办法"
    article: "第十一条"
    note: "采购需求应当明确、完整"

suggestion:
  template: "明确服务工作的具体内容和人员配置要求"
