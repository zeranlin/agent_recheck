id: PROC-009
name: 评定分离适用范围
category: procurement
level: low

pattern:
  type: regex
  match:
    - "评定分离.*适用范围"
    - "重大项目.*评定分离"
    - "特定品目.*评定分离"
    - "评定分离.*一千万元"

verification:
  check_type: positive

suggestion:
  template: "评定分离适用范围：重大项目（1000万以上）或特定品目（家具、用具等）"
  example: "鼓励采购人在执行重大项目和特定品目项目政府采购时选择适用评定分离"
