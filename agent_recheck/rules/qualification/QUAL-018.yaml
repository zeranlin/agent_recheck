id: QUAL-018
name: 检测报告与检测标准对应要求
category: qualification
level: medium

pattern:
  type: regex
  match:
    - "CMA.*报告.*检测标准"
    - "检测方法.*对应"
    - "检测.*标准.*对应"
    - "认证认可.*信息平台"

verification:
  check_type: negative

suggestion:
  template: "设置CMA标识的报告需对应设置该检测的检测标准"
  example: "若检测报告体现CMA，需对应设置检测标准"
