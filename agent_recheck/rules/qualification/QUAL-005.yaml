# -*- coding: utf-8 -*-
# 资质要求规则 - 证书得分标准缺失

id: QUAL-005
name: 证书得分标准不明确
category: qualification
level: medium
description: |
  资质证书要求未明确最低级别要求或得分标准，
  可能导致"最低级乃至没有该证书都可得分"的情况。
enabled: true

# 触发条件
trigger:
  type: composite
  match:
    - "证书"
    - "资质"
  conditions:
    - keyword: "证书"
    - keyword: "分值"
    - level_match: "(?:四|4|甲|乙|丙|一|二|三)级"

verification:
  check_type: contextual
  # 检查是否有明确的级别要求
  check_patterns:
    - "不低于"
    - "以上"
    - "含"
    - "取得"

reference:
  - name: "87号令"
    article: "第五十五条"
    note: "评审因素应当细化和量化"

suggestion:
  template: "明确各等级证书对应的分值，删除模糊表述"
