id: QUAL-017
name: 检测报告单一来源歧视
category: qualification
level: high

pattern:
  type: regex
  match:
    - "同一份.*检测报告.*全部"
    - "一份报告.*所有.*指标"
    - "同一份.*报告.*涵盖.*全部"
    - "一份报告涵盖"

verification:
  check_type: negative

suggestion:
  template: "禁止要求同一份检测报告必须包含全部内容，应允许提供多份报告"
  example: "同一份检测报告需包含上述全部内容"
