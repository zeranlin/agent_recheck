# -*- coding: utf-8 -*-
# 认证证书规则 - 售后服务认证

id: CERT-001
name: 售后服务认证构成歧视性要求
category: certifications
level: high
description: |
  售后服务认证（GB/T27922）属于商业性认证，
  该认证对企业规模和分支机构有硬性要求，
  变相将供应商规模条件作为加分条件，构成对中小企业的歧视性要求。
enabled: true

# 触发条件
trigger:
  type: keyword
  match:
    - "售后服务认证"
    - "售后服务体系认证"
    - "GB/T27922"

verification:
  check_type: contextual
  require_context:
    - "认证"

reference:
  - name: "政府采购促进中小企业发展管理办法"
    article: "第三条"
    note: "不得变相将供应商规模条件作为评审因素"

suggestion:
  template: "删除售后服务认证要求，或改为对中小企业无歧视性的要求"
