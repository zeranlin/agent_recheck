# -*- coding: utf-8 -*-
# 认证证书规则 - 认证有效期检查

id: CERT-004
name: 认证有效期检查
category: certifications
level: low
description: 检查认证证书是否在有效期内
enabled: true

# 触发条件
trigger:
  type: keyword
  match:
    - "有效期至"
    - "有效期"
    - "认证证书"
    - "到期"

# pattern: 用于正则匹配
pattern:
  type: regex
  match:
    - "有效期至"
    - "认证证书有效期"
    - "证书有效期"

# 法律依据
reference:
  - name: "认证认可条例"
    article: "相关规定"
    note: "认证证书应在有效期内使用"

# 建议模板
suggestion:
  template: "确保所有认证证书在投标时仍在有效期内"
