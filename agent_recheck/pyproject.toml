[project]
name = "agent_recheck"
version = "0.1.0"
description = "政府采购招投标文件合规性审查智能体"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agent Team"}
]
keywords = ["government", "procurement", "compliance", "review", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # 文档解析
    "python-docx>=1.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.23.0",

    # LLM
    "openai>=1.0.0",

    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # 配置与数据
    "pyyaml>=6.0",
    "pydantic>=2.0.0",

    # 日志与监控
    "structlog>=23.0.0",

    # 网络
    "httpx>=0.25.0",

    # 其他
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
security = [
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
agent_recheck = "cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "analyzer*", "models*", "utils*", "tracker*", "evaluator*", "report*", "knowledge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
